<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aasiya's Journal & Community</title>
  <style>
    :root {
      --bg-page: #f0f7ff;
      --bg-gradient: linear-gradient(180deg, #e0f2fe 0%, #f0f7ff 320px, #f8fbff 100%);
      --bg-card: #ffffff;
      --bg-subtle: #eff6ff;
      --bg-input: #f8fbff;
      --border: #bae6fd;
      --border-strong: #7dd3fc;
      --text-primary: #0c2d48;
      --text-secondary: #3b5978;
      --text-muted: #6482a0;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-light: #e0f2fe;
      --accent-sky: #0ea5e9;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #059669;
      --success-bg: #ecfdf5;
      --shadow-sm: 0 2px 8px rgba(2, 132, 199, 0.06);
      --shadow-md: 0 10px 28px rgba(2, 132, 199, 0.11);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-gradient);
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.65;
      min-height: 100vh;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(240, 247, 255, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1060px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
      cursor: pointer;
    }

    .brand-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.28);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: block;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Buttons */
    button, .btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.22);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover {
      background: var(--accent-light);
      color: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
    }

    .btn-danger:hover {
      background: #fee2e2;
    }

    .btn-sm {
      padding: 6px 11px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    .badge {
      background: #ef4444;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
    }

    .owner-pill {
      background: var(--accent-light);
      color: var(--accent-hover);
      border: 1px solid var(--border-strong);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .container {
      max-width: 1060px;
